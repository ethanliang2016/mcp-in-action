worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 加权轮询：大机器扛更多流量（与文章一致 3:2:1）
    upstream mcp_backend {
        server store-ha-app-1:8088 weight=3 max_fails=2 fail_timeout=10s;
        server store-ha-app-2:8088 weight=2 max_fails=2 fail_timeout=10s;
        server store-ha-app-3:8088 weight=1 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        # 公共代理头：所有 location 共享（修复 Tomcat 11 因 Host=mcp_backend 下划线报 400）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # MCP 端点转发
        location / {
            proxy_pass http://mcp_backend;
        }

        # 健康检查端点（被动检查：靠真实请求失败计数，非主动 ping）
        location /actuator/health {
            proxy_pass http://mcp_backend/actuator/health;
            access_log off;
        }
    }
}
